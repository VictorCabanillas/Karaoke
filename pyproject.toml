[project]
name = "karaoke"
version = "0.1.0"
description = "Karaoke entre amigos: los móviles hacen de micrófono"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "mutagen>=1.47",
    "python-multipart>=0.0.9",
    "segno>=1.6",
]

[project.optional-dependencies]
# Heavy audio processing (phase 2). Install with: uv sync --extra processing
processing = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "librosa>=0.10",
    "torch>=2.5,<2.9",
    "torchaudio>=2.5,<2.9",
    "demucs>=4.0.1",
    "torchcrepe>=0.0.23",
    "faster-whisper>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "numpy>=1.26",
]

[tool.uv]
package = false

# CUDA builds of torch on Windows/Linux (falls back to CPU at runtime if there is no GPU).
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
